version: "1.0"
name: "full-rag-governance"
description: >
  Tool-level governance for the Full-RAG assistant: deny destructive tools,
  block dangerous payloads, and allow only the tools this app uses.

defaults:
  action: deny

rules:
  # 1. Hard block of dangerous tools, whatever the args
  - name: deny_destructive_tools
    priority: 100
    action: deny
    condition:
      field: tool_name
      operator: in
      value: [delete_collection, drop_database, execute_raw_sql, delete_file, write_file, run_command, execute_code]
    message: "Tool is on the deny-list"

  # 2. Block dangerous payloads inside any tool's args
  - name: deny_dangerous_content
    priority: 90
    action: deny
    condition:
      field: content
      operator: matches
      value: '(?i)(rm\s+-rf|drop\s+(table|database)|truncate\s+table|xp_cmdshell|or\s+1\s*=\s*1|;\s*--)'
    message: "Arguments match a blocked pattern"

  # 3. Allow only the tools this app uses
  - name: allow_known_tools
    priority: 80
    action: allow
    condition:
      field: tool_name
      operator: in
      value: [chroma_query, llm_generate, mem0_read, mem0_write, pdf_ingest]
    message: "Tool is allow-listed"
