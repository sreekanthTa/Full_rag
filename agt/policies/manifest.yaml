# Agent Control Specification (ACS) manifest for the Full-RAG assistant.
# Binds Rego policies to native intervention points in the RAG pipeline.
# See: https://microsoft.github.io/agent-governance-toolkit/packages/#agent-control-specification

schema: "acs/v1"
name: "full-rag-governance"
version: "1.0.0"
description: "Governance policies for the Full-RAG assistant (Chroma, LLM, Mem0)"

agent_id: ${AGT_AGENT_ID}
session_id: ${AGT_SESSION_ID}

intervention_points:
  # Chroma vector store queries
  - point: "pre_tool_call"
    tool: "chroma_query"
    policy: "allow_chroma_query"

  # LLM generation calls
  - point: "pre_tool_call"
    tool: "llm_generate"
    policy: "allow_llm_generate"

  # Mem0 memory operations
  - point: "pre_tool_call"
    tool: "mem0_read"
    policy: "allow_mem0_read"

  - point: "pre_tool_call"
    tool: "mem0_write"
    policy: "allow_mem0_write"

  # PDF upload/ingest
  - point: "pre_tool_call"
    tool: "pdf_ingest"
    policy: "allow_pdf_ingest"

policies:
  - name: "allow_chroma_query"
    source: "policy.rego"
    entrypoint: "allow_chroma_query"

  - name: "allow_llm_generate"
    source: "policy.rego"
    entrypoint: "allow_llm_generate"

  - name: "allow_mem0_read"
    source: "policy.rego"
    entrypoint: "allow_mem0_read"

  - name: "allow_mem0_write"
    source: "policy.rego"
    entrypoint: "allow_mem0_write"

  - name: "allow_pdf_ingest"
    source: "policy.rego"
    entrypoint: "allow_pdf_ingest"

budgets:
  - tool: "llm_generate"
    max_calls_per_minute: 60
    max_tokens_per_minute: 100000

  - tool: "chroma_query"
    max_calls_per_minute: 120

audit:
  level: "detailed"
  include_inputs: true
  include_outputs: false