# AGT Policy — strict template
# Generated by: agent-os policy generate --template strict
version: '1.0'
rules:
- action: web_search
  effect: allow
- action: read_file
  effect: allow
- action: '*'
  effect: deny
  reason: 'Strict mode: all actions blocked by default'
content_filters:
  blocked_patterns:
  - \b\d{3}-\d{2}-\d{4}\b
  - \b\d{16}\b
settings:
  require_human_approval: true
  max_tool_calls_per_session: 20
  log_level: audit
